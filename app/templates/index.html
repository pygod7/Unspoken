<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodLift - Yours Healing Place</title>
    <link href="https://fonts.googleapis.com/css2?family=Bellota:wght@400;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ---------------- Global Styles ---------------- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f172a;
            color: white;
            font-family: "Bellota", sans-serif;
            min-height: 100vh;
        }

        a {
            text-decoration: none;
        }

        /* ---------------- Header & Navbar ---------------- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 16px 40px;
            z-index: 10;
            background: transparent;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-left img {
            height: 60px;
            width: auto;
        }

        .brand-name {
            font-size: 2.4rem;
            font-weight: 700;
        }

        /* ---------------- Desktop Navigation Links ---------------- */
        .nav-links {
            display: flex;
            gap: 40px;
            align-items: center;
        }

        .nav-links a {
            color: #cbd5e1;
            font-weight: 800;
            font-size: 1.2rem;
            position: relative;
            transition: color 0.3s ease;
        }

        /* underline animation for links */
        .nav-links a::after {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: -6px;
            width: 0%;
            height: 2px;
            background: #00ffcc;
            border-radius: 4px;
            transition: width 0.35s ease;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-links a:hover {
            color: #00ffcc;
        }

        /* disable underline for main CTA button */
        .nav-links a.cta-btn::after {
            display: none;
        }

        /* ---------------- Hamburger Menu ---------------- */
        .hamburger-menu {
            display: none;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
        }

        .hamburger-menu span {
            width: 26px;
            height: 3px;
            background: #cbd5e1;
            border-radius: 3px;
            transition: 0.4s;
        }

        /* animation */
.hamburger-menu.active span:nth-child(1) {
    transform: rotate(0deg) translateY(8px) scaleX(0.7);
    background: #00ffcc; /* optional color change on active */
}

.hamburger-menu.active span:nth-child(2) {
    transform: scaleX(0); /* middle line shrinks to nothing */
    opacity: 0;
}

.hamburger-menu.active span:nth-child(3) {
    transform: rotate(0deg) translateY(-8px) scaleX(0.7);
    background: #00ffcc;
}


        /* ---------------- Mobile Navigation ---------------- */
        .mobile-nav {
            display: flex;
            flex-direction: column;
            gap: 24px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(15,23,40,0.95);
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s ease;
            z-index: 9;
        }

        .mobile-nav.active {
            opacity: 1;
            visibility: visible;
        }

        .mobile-nav a {
            font-size: 2rem;
            color: #cbd5e1;
            text-decoration: none;
        }

        .mobile-nav a:hover {
            color: #00ffcc;
        }

        /* ---------------- CTA Button ---------------- */
        .cta-btn {
            padding: 10px 18px;
            background: #00ffcc20;   /* subtle tint */
            border: 1px solid #00ffcc60;
            border-radius: 14px;
            color: #e0fdfa;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 15px rebeccapurple;
        }

        .cta-btn:hover {
            background: #00ffcc40;
            border-color: #00ffcc;
            box-shadow: 0 0 12px #00ffcc70;
            color: white;
        }

        /* ---------------- Responsive ---------------- */
        @media(max-width: 768px) {
            .nav-links {
                display: none;
            }

            .hamburger-menu {
                display: flex;
            }
        }

    </style>
</head>
<body>

    <!-- ================= Header ================= -->
    <header>
        <nav>
            <!-- Logo and Brand -->
            <div class="nav-left">
                <span><img src="https://i.ibb.co/kVj71L00/moodlift-logo.png" alt="Logo"></span>
                <span class="brand-name">MoodLift</span>
            </div>

            <!-- Desktop Navigation -->
            <div class="nav-links">
                <a href="#">About</a>
                <a href="#">Features</a>
                <a href="#">Community</a>
                <a href="#" class="cta-btn">Get Started ♡</a>
            </div>

            <!-- Mobile Navigation -->
            <div class="mobile-nav">
                <a href="#">About</a>
                <a href="#">Features</a>
                <a href="https://google.com/">Community</a>
                <a href="#" class="cta-btn">Get Started ♡</a>
            </div>

            <!-- Hamburger Icon -->
            <div class="hamburger-menu">
                <span></span><span></span><span></span>
            </div>
        </nav>
    </header>

    <!-- ================= JS for Hamburger ================= -->
    <script>
        // select hamburger & mobile nav
        const hamburger = document.querySelector('.hamburger-menu');
        const mobileNav = document.querySelector('.mobile-nav');

        // toggle menu on hamburger click
        hamburger.addEventListener('click', (e) => {
            e.stopPropagation(); // prevent document click from firing
            hamburger.classList.toggle('active');
            mobileNav.classList.toggle('active');
        });

        // close menu if clicked outside
        document.addEventListener('click', () => {
            if(mobileNav.classList.contains('active')){
                mobileNav.classList.remove('active');
                hamburger.classList.remove('active');
            }
        });

        // prevent menu from closing when clicking links inside
        const mobileLinks = document.querySelectorAll('.mobile-nav a');
        mobileLinks.forEach(link => {
            link.addEventListener('click', (e) => e.stopPropagation());
        });
    </script>

</body>
</html>
