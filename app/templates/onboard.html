<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Bellota:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  padding: 0;
  font-family: 'Inter', sans-serif;
  background: linear-gradient(180deg, #111827, #1b1f33);
  color: white;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.welcome h2 {
  font-family: 'Bellota', sans-serif;
  font-size: 80px;
  margin: 0;
  opacity: 0;
  transform: translateY(20px);
  color: #ffd6eb;
  text-shadow: 0 0 15px rgba(255, 214, 235, 0.6);
  animation: fadeUp 2s ease-out forwards, glowPulse 4s ease-in-out infinite;
}

@keyframes fadeUp {
  0% { opacity: 0; transform: translateY(20px); }
  90% { opacity: 1; transform: translateY(0); }
  100% {opacity: 0;}
}

@keyframes glowPulse {
  0%,100% { text-shadow: 0 0 15px rgba(255,214,235,0.6);}
  50% { text-shadow: 0 0 25px rgba(255,214,235,0.8);}
}

.onboarding-card{
    display: flex;
}

.onboarding-card h3{
    font-family: 'Bellota';
}

</style>
</head>

<body>
    <main>
        <div class="welcome">
<h2>Welcome Rubin 😉😊</h2>
        </div>

        <div class="onboarding-card">
<h3> Before Continuing, Lets know about you first.</h3>
        </div>
    </main>
</body>
<script>
    const aniwel = document.querySelector('.welcome h2');
    const welcomeDiv = document.querySelector('.welcome');
    aniwel.addEventListener('animationend', ()=>{
        aniwel.style.display='none';
        document.body.style.overflow = 'auto';
        welcomeDiv.remove();
    })
</script>
</html>
